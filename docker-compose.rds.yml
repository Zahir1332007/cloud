# ==============================================================================
# CloudStore E-Commerce - Producción en AWS EC2 con Amazon RDS PostgreSQL
# ==============================================================================
# Este archivo orquesta los servicios en tu servidor EC2 conectándose directamente
# a tu base de datos gestionada en Amazon RDS, liberando memoria RAM en la t2.micro.
# Uso en EC2:
#   sudo docker compose -f docker-compose.rds.yml up -d --build
# ==============================================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudstore_api
    restart: always
    env_file:
      - .env
    environment:
      PROJECT_NAME: ${PROJECT_NAME:-CloudStore E-Commerce API}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DB_HOST: ${DB_HOST:-database-1.cdwwom8ggmi8.us-east-2.rds.amazonaws.com}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-postgres}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-CloudStore2026!}
      DB_SSLMODE: ${DB_SSLMODE:-verify-full}
      DB_SSLROOTCERT: ${DB_SSLROOTCERT:-./global-bundle.pem}
      SECRET_KEY: ${SECRET_KEY:-aws-cloudstore-production-jwt-secret-key-2026}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
    volumes:
      - ./global-bundle.pem:/app/global-bundle.pem:ro
    networks:
      - cloudstore_net
    deploy:
      resources:
        limits:
          memory: 350M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudstore_ui
    restart: always
    depends_on:
      - backend
    networks:
      - cloudstore_net
    deploy:
      resources:
        limits:
          memory: 150M

  nginx:
    image: nginx:alpine
    container_name: cloudstore_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - cloudstore_net
    deploy:
      resources:
        limits:
          memory: 100M

networks:
  cloudstore_net:
    driver: bridge

