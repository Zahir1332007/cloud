# ==============================================================================
# CloudStore E-Commerce - Producción en AWS EC2 con Amazon RDS PostgreSQL
# ==============================================================================
# Este archivo orquesta los servicios en tu servidor EC2 conectándose directamente
# a tu base de datos gestionada en Amazon RDS, liberando memoria RAM en la t2.micro.
# Uso en EC2:
#   sudo docker compose -f docker-compose.rds.yml up -d --build
# ==============================================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudstore_api
    restart: always
    env_file:
      - .env
    environment:
      PROJECT_NAME: "CloudStore E-Commerce API"
      ENVIRONMENT: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:CloudStore2026!@database-1.cdwwom8ggmi8.us-east-2.rds.amazonaws.com:5432/postgres?sslmode=require}
      SECRET_KEY: ${SECRET_KEY:-aws-cloudstore-production-jwt-secret-key-2026}
      ACCESS_TOKEN_EXPIRE_MINUTES: 10080
    networks:
      - cloudstore_net
    deploy:
      resources:
        limits:
          memory: 350M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudstore_ui
    restart: always
    depends_on:
      - backend
    networks:
      - cloudstore_net
    deploy:
      resources:
        limits:
          memory: 150M

  nginx:
    image: nginx:alpine
    container_name: cloudstore_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - cloudstore_net
    deploy:
      resources:
        limits:
          memory: 100M

networks:
  cloudstore_net:
    driver: bridge
