services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudstore_api
    restart: always
    environment:
      PROJECT_NAME: "CloudStore API"
      ENVIRONMENT: production
      DB_ENGINE: mysql
      DB_HOST: ${DB_HOST:-database-1.cdwwom8ggmi8.us-east-2.rds.amazonaws.com}
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-cloudstore}
      DB_USER: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-admin123}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      SECRET_KEY: ${SECRET_KEY:-aws-cloudstore-production-jwt-secret-key-2026}
      ACCESS_TOKEN_EXPIRE_MINUTES: 10080
    networks:
      - cloudstore_net
    deploy:
      resources:
        limits:
          memory: 350M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudstore_ui
    restart: always
    depends_on:
      - backend
    networks:
      - cloudstore_net
    deploy:
      resources:
        limits:
          memory: 200M

  nginx:
    image: nginx:alpine
    container_name: cloudstore_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - cloudstore_net
    deploy:
      resources:
        limits:
          memory: 100M

networks:
  cloudstore_net:
    driver: bridge
