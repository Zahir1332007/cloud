services:
  mysql:
    image: mysql:8.0
    container_name: cloudstore_db
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mysql123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cloudstore}
      MYSQL_USER: ${MYSQL_USER:-cloudstore}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mysql123}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p${MYSQL_ROOT_PASSWORD:-mysql123}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - cloudstore_net
    deploy:
      resources:
        limits:
          memory: 350M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudstore_api
    restart: always
    environment:
      PROJECT_NAME: "CloudStore API"
      ENVIRONMENT: production
      DB_ENGINE: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-cloudstore}
      DB_USER: ${MYSQL_USER:-cloudstore}
      DB_PASSWORD: ${MYSQL_PASSWORD:-mysql123}
      DB_SSLMODE: disable
      SECRET_KEY: ${SECRET_KEY:-aws-cloudstore-production-jwt-secret-key-2026}
      ACCESS_TOKEN_EXPIRE_MINUTES: 10080
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - cloudstore_net
    deploy:
      resources:
        limits:
          memory: 300M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudstore_ui
    restart: always
    depends_on:
      - backend
    networks:
      - cloudstore_net
    deploy:
      resources:
        limits:
          memory: 150M

  nginx:
    image: nginx:alpine
    container_name: cloudstore_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - cloudstore_net
    deploy:
      resources:
        limits:
          memory: 100M

volumes:
  mysql_data:
    driver: local

networks:
  cloudstore_net:
    driver: bridge
