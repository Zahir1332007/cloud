services:
  postgres:
    image: postgres:16-alpine
    container_name: cloudstore_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: ${POSTGRES_DB:-cloudstore}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cloudstore}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cloudstore_net
    deploy:
      resources:
        limits:
          memory: 300M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudstore_api
    restart: always
    environment:
      PROJECT_NAME: "CloudStore API"
      ENVIRONMENT: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@postgres:5432/${POSTGRES_DB:-cloudstore}
      SECRET_KEY: ${SECRET_KEY:-aws-cloudstore-production-jwt-secret-key-2026}
      ACCESS_TOKEN_EXPIRE_MINUTES: 10080
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cloudstore_net
    deploy:
      resources:
        limits:
          memory: 300M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudstore_ui
    restart: always
    depends_on:
      - backend
    networks:
      - cloudstore_net
    deploy:
      resources:
        limits:
          memory: 150M

  nginx:
    image: nginx:alpine
    container_name: cloudstore_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - cloudstore_net
    deploy:
      resources:
        limits:
          memory: 100M

volumes:
  postgres_data:
    driver: local

networks:
  cloudstore_net:
    driver: bridge
